[book]
authors = ["Rakibul Yeasin"]
language = "en"
multilingual = false
src = "."
title = "MCP Connect"

[build]
build-dir = "../book"

[output.html]
site-url = "/mcp-connect/"
git-repository-url = "https://github.com/dreygur/mcp-connect"
edit-url-template = "https://github.com/dreygur/mcp-connect/edit/main/docs/{path}"
default-theme = "ayu"
preferred-dark-theme = "ayu"
smart-punctuation = true
mathjax-support = false
copy-fonts = true
no-section-label = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
use-hierarchical-levels = true

[output.html.playground]
editable = false
copy-js = true
