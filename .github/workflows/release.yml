name: 🦀 MCP-Connect Release

on:
  workflow_dispatch: # Allow manual triggering from GitHub Actions UI
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.0). Leave empty to build only without creating a release."
        required: false
        type: string
  push:
    tags:
      - "v*" # Trigger on version tags like v0.1.0

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mcp-connect-linux-x86_64.tar.gz
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: mcp-connect-darwin-x86_64.tar.gz
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mcp-connect-darwin-aarch64.tar.gz
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mcp-connect-windows-x86_64.zip
            ext: ".exe"

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: ⚡ Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: 🏗️ Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 🗜️ Package binary and checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $BIN = "mcp-connect"
          $OUT_DIR = "dist"
          $TARGET_DIR = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path $OUT_DIR | Out-Null

          Copy-Item "${TARGET_DIR}/${BIN}.exe" -Destination "."
          Compress-Archive -Path "${BIN}.exe" -DestinationPath "${OUT_DIR}/${{ matrix.artifact }}" -Force

          # Generate SHA256 checksum
          $hash = Get-FileHash -Path "${OUT_DIR}/${{ matrix.artifact }}" -Algorithm SHA256
          $hash.Hash.ToLower() | Out-File -FilePath "${OUT_DIR}/${{ matrix.artifact }}.sha256" -Encoding ASCII

      - name: 🗜️ Package binary and checksum (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -eux
          BIN="mcp-connect"
          OUT_DIR="dist"
          TARGET_DIR="target/${{ matrix.target }}/release"
          mkdir -p "$OUT_DIR"

          tar -czvf "${OUT_DIR}/${{ matrix.artifact }}" -C "${TARGET_DIR}" "${BIN}"

          # Generate SHA256 checksum
          cd "$OUT_DIR"
          shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: 📋 Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger: use input tag if provided
            if [[ -n "${{ inputs.tag }}" ]]; then
              echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
              echo "has_tag=true" >> $GITHUB_OUTPUT
            else
              echo "has_tag=false" >> $GITHUB_OUTPUT
            fi
          else
            # Push event: use the tag from the ref
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "has_tag=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Publish to GitHub Release
        if: steps.release_tag.outputs.has_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: dist/*
          draft: false
          prerelease: ${{ contains(steps.release_tag.outputs.tag, '-rc') || contains(steps.release_tag.outputs.tag, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Upload artifacts (build only)
        if: steps.release_tag.outputs.has_tag != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 7
