<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authentication Successful</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2)}
.card{background:#fff;border-radius:16px;padding:48px;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);max-width:400px;animation:slideUp .5s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.icon{width:80px;height:80px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;animation:scaleIn .3s ease-out .2s both}
@keyframes scaleIn{from{transform:scale(0)}to{transform:scale(1)}}
.icon svg{width:40px;height:40px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.checkmark{stroke-dasharray:50;stroke-dashoffset:50;animation:draw .5s ease-out .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
h1{color:#1f2937;font-size:24px;font-weight:600;margin-bottom:8px}
p{color:#6b7280;font-size:15px;line-height:1.5}
.hint{margin-top:24px;padding-top:24px;border-top:1px solid #e5e7eb;font-size:13px;color:#9ca3af}
</style>
</head>
<body>
<div class="card">
<div class="icon"><svg viewBox="0 0 24 24"><path class="checkmark" d="M5 12l5 5L19 7"/></svg></div>
<h1>Authentication Successful</h1>
<p>You have been successfully authenticated.<br>You can now close this window.</p>
<p class="hint">Return to your terminal to continue</p>
</div>
</body>
</html>
