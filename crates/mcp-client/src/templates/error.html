<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authentication Failed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#ef4444,#dc2626)}
.card{background:#fff;border-radius:16px;padding:48px;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);max-width:440px;animation:slideUp .5s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.icon{width:80px;height:80px;background:linear-gradient(135deg,#ef4444,#dc2626);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;animation:scaleIn .3s ease-out .2s both}
@keyframes scaleIn{from{transform:scale(0)}to{transform:scale(1)}}
.icon svg{width:40px;height:40px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
h1{color:#1f2937;font-size:24px;font-weight:600;margin-bottom:8px}
p{color:#6b7280;font-size:15px;line-height:1.5}
.error-code{margin-top:20px;padding:12px 16px;background:#fef2f2;border-radius:8px;font-family:monospace;font-size:13px;color:#991b1b;word-break:break-word}
.hint{margin-top:24px;padding-top:24px;border-top:1px solid #e5e7eb;font-size:13px;color:#9ca3af}
</style>
</head>
<body>
<div class="card">
<div class="icon"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></div>
<h1>Authentication Failed</h1>
<p>{description}</p>
<div class="error-code">{error}</div>
<p class="hint">Please close this window and try again</p>
</div>
</body>
</html>
